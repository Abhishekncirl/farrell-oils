<!doctype html>
<html lang="%LANG%">
  <head>
    <!--
      %TOKENS% are filled from src/config/site.js at build time (see vite.config.js).
      Tags marked data-rh are replaced per page by react-helmet-async (src/components/Seo.jsx).
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" data-rh="true" />
    <meta name="keywords" content="%KEYWORDS%" />
    <meta name="author" content="%SITE_NAME%" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="format-detection" content="telephone=yes" />
    <!-- [TODO: confirm domain name] URLs use the GitHub Pages address until a domain is set in site.js -->
    <link rel="canonical" href="%SITE_URL%/" data-rh="true" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="%LOCALE%" />
    <meta property="og:title" content="%TITLE%" data-rh="true" />
    <meta property="og:description" content="%DESCRIPTION%" data-rh="true" />
    <meta property="og:url" content="%SITE_URL%/" data-rh="true" />
    <meta property="og:image" content="%OG_IMAGE%" data-rh="true" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%TITLE%" data-rh="true" />
    <meta name="twitter:description" content="%DESCRIPTION%" data-rh="true" />
    <meta name="twitter:image" content="%OG_IMAGE%" data-rh="true" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
%JSON_LD%
    </script>
  </head>
  <body>
    <noscript>Farrell Oils, Carrickmacross, Co. Monaghan. Call 087 917 6881.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
